# Configuración del proyecto "roman" (librería pura, sin dependencias de runtime).
# La sección [build-system] habilita `pip install .` como dependencia interna.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roman"
version = "0.1.0"
description = "Minimal integer <-> Roman numeral conversion (1..3999, canonical subtractive notation)."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["roman"]

[tool.pytest.ini_options]
# `pythonpath` hace resoluble `from roman import ...` sin instalación editable.
pythonpath = ["src"]
testpaths = ["tests"]
